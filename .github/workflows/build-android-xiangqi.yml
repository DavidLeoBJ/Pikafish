name: Build Xiangqi Eye Android (ARM64)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout 象眼引擎源码
      uses: actions/checkout@v4
      with:
        repository: xqbase/xiangqi-eye
        fetch-depth: 1

    - name: 配置 Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: r25c
        add-to-path: true

    - name: 编译 ARM64 静态二进制
      run: |
        cd src
        "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++" \
          -O3 -DNDEBUG -static -o xiangqi-eye-android \
          main.cpp movegen.cpp search.cpp eval.cpp \
          -pthread

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: xiangqi-eye-android-arm64
        path: src/xiangqi-eye-android

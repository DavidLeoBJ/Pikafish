name: Android ARM64 Pikafish Build (TLS 64KB Alignment Fix)
run-name: Build Android ARM64 Pikafish (TLS Fixed)
on:
  push:
    branches: [ fix/android-tls-alignment ]
  workflow_dispatch:
jobs:
  build-android-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 2. Setup Android NDK r26 (Official Stable Version)
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.1.10909125'
          accept-android-sdk-licenses: true
      - name: 3. Build Pikafish ARM64 with TLS Fix
        run: |
          cd src
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          make clean
          echo "=== 开始编译ARM64版本（TLS 64KB对齐）==="
          make -j$(nproc) ARCH=armv8 build
          if [ ! -f "pikafish" ]; then
            echo "❌ 编译失败：未生成pikafish二进制文件"
            exit 1
          fi
          echo "✅ 编译成功！产物信息："
          ls -lh pikafish
      - name: 4. Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-android-arm64v8a-tls-fixed
          path: src/pikafish
          retention-days: 90

name: Android ARM64 Pikafish Build (TLS 64KB Alignment Fix)
run-name: Build Android ARM64 Pikafish (TLS Fixed)

on:
  push:
    branches: [ fix/android-tls-alignment ]
  workflow_dispatch:

jobs:
  build-android-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      # 1. 拉取代码
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 【核心修改】手动下载并安装 NDK (带断点续传和重试，最稳！)
      - name: 2. Manual Install Android NDK r26 (Super Stable)
        run: |
          # 1. 更新系统并安装必要工具
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          
          # 2. 设置变量
          NDK_ZIP="android-ndk-r26-linux.zip"
          NDK_PATH="$HOME/android-ndk/android-26"
          
          echo "=== 检查本地是否有缓存的 NDK ==="
          if [ -d "$NDK_PATH" ]; then
            echo "✅ 发现已存在的 NDK，跳过下载，直接使用！"
          else
            echo "⏳ 未发现缓存，开始从 Google 下载 (带 5 次重试机制)..."
            # 使用 wget 下载，--tries=5 表示失败自动重试 5 次
            wget -q --tries=5 --timeout=30 --continue \
              "https://dl.google.com/android/repository/${NDK_ZIP}" \
              -O /tmp/$NDK_ZIP
            
            echo "✅ 下载完毕，开始解压 (这可能需要几分钟，请耐心等待)..."
            mkdir -p $HOME/android-ndk
            unzip -q /tmp/$NDK_ZIP -d $HOME/android-ndk
            rm -f /tmp/$NDK_ZIP
            echo "✅ NDK 解压完成！"
          fi

          # 3. 强制写入环境变量，确保后续步骤一定能找到它
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV

      # 3. 编译 Pikafish
      - name: 3. Build Pikafish ARM64 with TLS Fix
        run: |
          cd src
          # 手动指定编译器路径
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          
          make clean
          echo "=== 开始编译 ARM64 (TLS 修复版) ==="
          make -j$(nproc) ARCH=armv8 build
          
          if [ ! -f "pikafish" ]; then
            echo "❌ 编译失败"
            exit 1
          fi
          echo "✅ 编译成功！"
          ls -lh pikafish

      # 4. 上传产物
      - name: 4. Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-android-arm64v8a-tls-fixed
          path: src/pikafish
          retention-days: 90

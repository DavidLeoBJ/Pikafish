# 完整覆盖粘贴，不要留任何旧内容
name: Android ARM64 Pikafish Build (TLS Fix)
run-name: Build Android ARM64 with 64KB TLS Alignment Fix

# 触发条件：推送/手动点按钮都能跑
on:
  push:
    branches: [ fix/android-tls-alignment ]
  workflow_dispatch:

jobs:
  build-android-arm64:
    # 用最新的LTS Ubuntu环境，兼容性最好
    runs-on: ubuntu-22.04
    timeout-minutes: 30  # 防止卡死无限跑

    steps:
      # ─── 第一步：拉取你的Pikafish源码（已经带改好的Makefile补丁）───
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # 只拉最新代码，加快速度

      # ─── 第二步：下载Linux版NDK r26（用清华镜像兜底，防Google直链抽风）───
      - name: 2. Download & Setup Android NDK r26 (Linux x86_64)
        run: |
          mkdir -p $HOME/android-ndk
          NDK_VER="android-ndk-r26-linux"
          NDK_ZIP="$NDK_VER.zip"
          
          # 优先用清华镜像下载，比dl.google.com稳10倍
          echo "::group::Downloading NDK..."
          if ! curl -fSL --connect-timeout 30 --retry 3 --retry-delay 5 \
            "https://mirrors.tuna.tsinghua.edu.cn/android-ndk/${NDK_ZIP}" \
            -o /tmp/$NDK_ZIP; then
            echo "清华镜像失败，fallback到官方源..."
            curl -fSL --connect-timeout 30 --retry 3 --retry-delay 5 \
              "https://dl.google.com/android/repository/${NDK_ZIP}" \
              -o /tmp/$NDK_ZIP
          fi
          echo "::endgroup::"

          echo "::group::Unzipping NDK..."
          unzip -q /tmp/$NDK_ZIP -d $HOME/android-ndk
          rm -f /tmp/$NDK_ZIP
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk/$NDK_VER" >> $GITHUB_ENV
          echo "NDK=$HOME/android-ndk/$NDK_VER" >> $GITHUB_ENV
          echo "::endgroup::"

          # 验证编译器可用
          echo "Using NDK compiler:"
          $HOME/android-ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ --version

      # ─── 第三步：执行交叉编译（完全对齐你本地测试时的参数，不会读错Makefile）───
      - name: 3. Build Pikafish ARM64 Static PIE with TLS Fix
        run: |
          cd ${{ github.workspace }}/src
          
          # 把NDK的编译器工具链临时挂进PATH，确保make能找到aarch64-clang++
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          export STRIP=aarch64-linux-android-strip
          
          echo "=== Start Compiling ==="
          make -j$(nproc) ARCH=armv8 build
          echo "=== Compile Done ==="
          
          # 二次校验：确认产物存在
          ls -lh pikafish
          file pikafish

      # ─── 第四步：把编译好的成品打包上传，直接下载就能用 ───
      - name: 4. Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-android-arm64v8a-fixed
          path: ${{ github.workspace }}/src/pikafish
          retention-days: 90  # 保留90天，不怕过期

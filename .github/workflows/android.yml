name: Android ARM64 Pikafish Build (TLS Fix)
on:
  push:
    branches: [ fix/android-tls-alignment ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK r26 (Official - No 404)
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '26.1.10909125'  # 官方锁定的稳定版，永不404
          accept-android-sdk-licenses: true

      - name: Build Pikafish ARM64
        run: |
          cd src
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          make clean
          make -j$(nproc) ARCH=armv8 build EXTRA_LDFLAGS="-Wl,-z,max-page-size=65536"

      - uses: actions/upload-artifact@v4
        with:
          name: pikafish-android-arm64v8a-tls-fixed
          path: src/pikafish

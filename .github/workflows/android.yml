name: Android ARM64 Pikafish (The One)
on:
  push:
    branches: [ fix/android-tls-alignment ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Manual NDK r26
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r26-linux.zip
          unzip -q android-ndk-r26-linux.zip
          mv android-ndk-r26 $HOME/android-ndk
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk" >> $GITHUB_ENV

      - name: Build with Explicit Clang
        run: |
          cd src
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          
          # 直接定义编译器和 flags，完全绕过 Makefile 的架构猜测
          export CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android21-clang++
          export CXXFLAGS="-std=c++17 -O3 -DNDEBUG -DIS_64BIT -DUSE_NEON=8"
          export LDFLAGS="-Wl,-z,max-page-size=65536 -static-libstdc++"
          
          echo "=== Using Compiler ==="
          $CXX --version
          
          echo "=== Compiling ==="
          # 直接调用 make，但不传 ARCH，让它用我们刚才定义的全局变量
          make -j$(nproc) build

      - uses: actions/upload-artifact@v4
        with:
          name: pikafish-android-arm64
          path: src/pikafish

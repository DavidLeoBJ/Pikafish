name: Android ARM64 Pikafish (Final Fix)
on:
  push:
    branches: [ fix/android-tls-alignment ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install NDK r26 via SDK Manager
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build Pikafish ARM64
        run: |
          cd src
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          export CC=aarch64-linux-android21-clang
          export CXX=aarch64-linux-android21-clang++
          make clean
          make -j$(nproc) ARCH=armv8 build EXTRA_LDFLAGS="-Wl,-z,max-page-size=65536"

      - uses: actions/upload-artifact@v4
        with:
          name: pikafish-android-arm64
          path: src/pikafish

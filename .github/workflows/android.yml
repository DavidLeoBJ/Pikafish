name: Android ARM64 Pikafish (Pure ARMv8)
on:
  push:
    branches: [ fix/android-tls-alignment ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Manual NDK r26
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r26-linux.zip
          unzip -q android-ndk-r26-linux.zip
          mv android-ndk-r26 $HOME/android-ndk
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk" >> $GITHUB_ENV

      - name: Build Pikafish (Force ARMv8 Context)
        run: |
          cd src
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          
          # 强制指定编译器
          export CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang
          export CXX=$TOOLCHAIN/bin/aarch64-linux-android21-clang++
          
          # 强制清理
          make clean
          
          echo "=== Compiling for pure ARMv8 ==="
          
          # 关键改动：
          # 1. 使用 ARCH=armv8 (让Makefile知道架构)
          # 2. 显式关闭 AVX2/SSE (防止代码试图使用 __m256i)
          # 3. 显式开启 NEON (确保 vaddvq_u16 可用)
          make -j$(nproc) build \
            ARCH=armv8 \
            COMP=clang \
            USE_AVX2=no \
            USE_SSE41=no \
            USE_SSSE3=no \
            USE_SSE2=no \
            USE_NEON=8 \
            CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang \
            CXX=$TOOLCHAIN/bin/aarch64-linux-android21-clang++ \
            EXTRA_LDFLAGS="-Wl,-z,max-page-size=65536 -static-libstdc++"

      - uses: actions/upload-artifact@v4
        with:
          name: pikafish-android-arm64
          path: src/pikafish

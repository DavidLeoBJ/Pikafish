name: Android ARM64 Pikafish (Final Link Fix)
on:
  push:
    branches: [ fix/android-tls-alignment ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Manual NDK r26
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r26-linux.zip
          unzip -q android-ndk-r26-linux.zip
          mv android-ndk-r26 $HOME/android-ndk
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk" >> $GITHUB_ENV

      - name: Build Pikafish (Override Linker Flags)
        run: |
          cd src
          export TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          
          make clean
          
          # 直接完全覆盖LDFLAGS，不让Makefile偷偷加多余的库
          make -j$(nproc) build \
            ARCH=armv8 \
            COMP=clang \
            USE_AVX2=no \
            USE_SSE41=no \
            USE_SSSE3=no \
            USE_SSE2=no \
            USE_NEON=8 \
            CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang \
            CXX=$TOOLCHAIN/bin/aarch64-linux-android21-clang++ \
            LDFLAGS="-Wl,-z,max-page-size=65536 -static-libstdc++ -latomic"

- name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: pikafish-android-arm64
          path: build/bin/pikafish  # 这是默认输出路径，如果你的路径不同请修改这里
